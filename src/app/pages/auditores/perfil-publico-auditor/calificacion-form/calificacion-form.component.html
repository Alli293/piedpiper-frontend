<section class="calificacion-form" aria-labelledby="calificacion-form-titulo">
  @if (cargando()) {
    <div class="calificacion-form__loading" role="status" aria-label="Cargando calificación">
      <span class="calificacion-form__spinner"></span>
    </div>
  } @else {
    <h3 class="calificacion-form__titulo" id="calificacion-form-titulo">
      {{ modoEdicion() ? 'Editar calificación' : 'Calificar auditor' }}
    </h3>

    <form novalidate (submit)="handleSubmit($event)">
      <div class="calificacion-form__campo">
        <label class="calificacion-form__label">Calificación</label>
        <app-star-rating
          [value]="model().calificacion"
          (valueChange)="onCalificacionChange($event)"
          [readonly]="guardando()"
          label="Calificación del auditor"
        />
        @if (calificacionError()) {
          <p class="calificacion-form__error" role="alert">{{ calificacionError() }}</p>
        }
      </div>

      <app-textarea
        label="Comentario (opcional)"
        [formField]="calificacionForm.comentario"
        placeholder="Comparta su experiencia con este auditor..."
        [rows]="3"
        [error]="comentarioError()"
        [hint]="caracteresComentario() + ' / ' + maximoCaracteresComentario + ' caracteres'"
      />

      <div class="calificacion-form__actions">
        <app-button type="submit" [disabled]="!puedeGuardar()" [loading]="guardando()">
          Guardar
        </app-button>
      </div>
    </form>
  }
</section>
