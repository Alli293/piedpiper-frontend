<section class="ch-madurez">
  <article class="ch-madurez-card" aria-label="Evolución histórica del IMA">
    <header class="ch-madurez-card__header">
      <span class="ch-madurez-card__icon" aria-hidden="true">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 3v18h18" />
          <path d="M19 9l-5 5-4-4-3 3" />
        </svg>
      </span>
      <div class="ch-madurez-card__titles">
        <app-heading level="h3" text="Evolución histórica del IMA" />
        <p class="ch-madurez-card__subtitle">
          IMA de tu empresa vs. promedio del sector, con eventos anotados.
        </p>
      </div>
      <app-select-input
        class="ch-madurez-card__ventana"
        [options]="ventanaOptions"
        [value]="String(ventana())"
        [disabled]="cargando()"
        placeholder="Ventana"
        ariaLabel="Seleccionar ventana de meses"
        (valueChange)="onVentanaChange($event)"
      />
    </header>

    @if (cargando()) {
      <p class="ch-madurez-card__estado" role="status">Cargando tendencia del IMA...</p>
    } @else if (sinHistorial()) {
      <p class="ch-madurez-card__estado">{{ sinHistorialMensaje }}</p>
    } @else {
      <app-ima-tendencia-chart [serie]="serie()" [eventos]="eventos()" />

      @if (sinDatosSectoriales()) {
        <p class="ch-madurez-card__aviso">{{ sinSectorMensaje }}</p>
      }
    }
  </article>
</section>
