<app-page-layout [sidebarConfig]="sidebarConfig()" [headerConfig]="headerConfig()">
  <div class="ch-configuracion">
    <app-card padding="lg" class="ch-configuracion__card">
      <div class="ch-configuracion__encabezado">
        <app-heading level="h2" [text]="i18n.t('config.preferencias.titulo')" />
        <p class="ch-configuracion__descripcion">
          {{ i18n.t('config.preferencias.descripcion') }}
        </p>
      </div>

      @if (cargando()) {
        <p class="ch-configuracion__cargando">{{ i18n.t('config.cargando') }}</p>
      } @else {
        <div class="ch-configuracion__campos">
          <div class="ch-configuracion__campo">
            <app-select-input
              [label]="i18n.t('config.idioma')"
              [options]="opcionesIdioma"
              [value]="idioma()"
              [disabled]="guardando()"
              (valueChange)="onIdiomaChange($event)"
            />
          </div>

          <div class="ch-configuracion__campo">
            <app-select-input
              [label]="i18n.t('config.moneda')"
              [options]="opcionesMoneda"
              [value]="moneda()"
              [disabled]="guardando()"
              (valueChange)="onMonedaChange($event)"
            />
          </div>

          <div class="ch-configuracion__campo">
            <app-select-input
              [label]="i18n.t('config.unidades')"
              [options]="opcionesUnidades"
              [value]="unidades()"
              [disabled]="guardando()"
              (valueChange)="onUnidadesChange($event)"
            />
            <p class="ch-configuracion__nota">{{ i18n.t('config.notaEmisiones') }}</p>
          </div>
        </div>

        <div class="ch-configuracion__acciones">
          <app-button
            data-testid="guardar-preferencias"
            variant="primary"
            [loading]="guardando()"
            [disabled]="guardando()"
            (click)="guardar()"
          >
            {{ i18n.t('config.guardar') }}
          </app-button>
        </div>
      }
    </app-card>
  </div>
</app-page-layout>
