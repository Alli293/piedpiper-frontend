<app-auth-layout>
  <div class="login">
    <header class="login__header">
      <h1 class="login__title">Iniciar sesión</h1>
      <p class="login__subtitle">Ingresa con tu cuenta CarbonHub.</p>
    </header>

    <div class="login__google" #googleButton></div>

    <div class="login__divider">
      <span>o continúa con correo electrónico</span>
    </div>

    <form class="login__form" (submit)="enviar($event)">
      <app-text-input
        label="Correo electrónico"
        type="email"
        autocomplete="email"
        placeholder="tucorreo@empresa.com"
        [value]="email()"
        (valueChange)="email.set($event)"
        [disabled]="cargando()"
      />

      <div class="login__password">
        <app-text-input
          label="Contraseña"
          [type]="mostrarContrasena() ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [value]="contrasena()"
          (valueChange)="contrasena.set($event)"
          [disabled]="cargando()"
        />
        <button
          type="button"
          class="login__password-toggle"
          [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="alternarContrasena()"
        >
          <app-icon [name]="mostrarContrasena() ? 'ocultar' : 'ver'" [size]="18" />
        </button>
      </div>

      @if (error()) {
        <p class="login__error" role="alert">{{ error() }}</p>
      }

      <a class="login__forgot" routerLink="/recuperar-contrasena">¿Olvidaste tu contraseña?</a>

      <app-button variant="primary" size="lg" type="submit" [loading]="cargando()">
        Iniciar sesión
      </app-button>
    </form>

    <p class="login__signup">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</app-auth-layout>
