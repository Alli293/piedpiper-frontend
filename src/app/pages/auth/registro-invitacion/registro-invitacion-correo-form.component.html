<form class="registro-invitacion-correo-form__form" novalidate (submit)="handleSubmit($event)">
  <app-text-input label="Correo electrónico" type="email" [value]="email()" [disabled]="true" />

  <app-text-input
    label="Nombre"
    autocomplete="given-name"
    placeholder="Tu nombre"
    [formField]="registroForm.nombre"
    [error]="errorNombre()"
  />

  <app-text-input
    label="Apellidos"
    autocomplete="family-name"
    placeholder="Tus apellidos"
    [formField]="registroForm.apellidos"
    [error]="errorApellidos()"
  />

  <div class="registro-invitacion-correo-form__password">
    <app-text-input
      label="Contraseña"
      [type]="mostrarContrasena() ? 'text' : 'password'"
      autocomplete="new-password"
      placeholder="Tu contraseña"
      [formField]="registroForm.contrasena"
      [error]="errorContrasena()"
    />
    <button
      type="button"
      class="registro-invitacion-correo-form__password-toggle"
      [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      (click)="alternarContrasena()"
    >
      <app-icon [name]="mostrarContrasena() ? 'ocultar' : 'ver'" [size]="18" />
    </button>
  </div>

  <div class="registro-invitacion-correo-form__password">
    <app-text-input
      label="Confirmar contraseña"
      [type]="mostrarConfirmar() ? 'text' : 'password'"
      autocomplete="new-password"
      placeholder="Repite tu contraseña"
      [formField]="registroForm.confirmarContrasena"
      [error]="errorConfirmacion()"
    />
    <button
      type="button"
      class="registro-invitacion-correo-form__password-toggle"
      [attr.aria-label]="mostrarConfirmar() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      (click)="alternarConfirmar()"
    >
      <app-icon [name]="mostrarConfirmar() ? 'ocultar' : 'ver'" [size]="18" />
    </button>
  </div>

  <app-checkbox [formField]="registroForm.aceptaTerminos" [error]="errorTerminos()">
    Acepto los <a routerLink="/terminos">Términos de servicio</a> y la
    <a routerLink="/privacidad">Política de privacidad</a> de CarbonHub
  </app-checkbox>

  @if (error()) {
    <p class="registro-invitacion-correo-form__error" role="alert">{{ error() }}</p>
  }

  <app-button
    variant="primary"
    size="lg"
    type="submit"
    [loading]="submitting()"
    [disabled]="submitting()"
  >
    Crear cuenta →
  </app-button>
</form>
