@if (!enviado()) {
  <form class="registro-usuario-form__form" (submit)="enviar($event)">
    <app-text-input
      label="Nombre"
      autocomplete="given-name"
      placeholder="Tu nombre"
      [value]="nombre()"
      (valueChange)="nombre.set($event)"
      [disabled]="cargando()"
    />

    <app-text-input
      label="Apellidos"
      autocomplete="family-name"
      placeholder="Tus apellidos"
      [value]="apellidos()"
      (valueChange)="apellidos.set($event)"
      [disabled]="cargando()"
    />

    <app-text-input
      label="Correo electrónico"
      type="email"
      autocomplete="email"
      placeholder="tucorreo@ejemplo.com"
      [value]="email()"
      (valueChange)="email.set($event)"
      [disabled]="cargando()"
    />

    <div class="registro-usuario-form__password">
      <app-text-input
        label="Contraseña"
        [type]="mostrarContrasena() ? 'text' : 'password'"
        autocomplete="new-password"
        placeholder="Tu contraseña"
        [value]="contrasena()"
        (valueChange)="contrasena.set($event)"
        [disabled]="cargando()"
      />
      <button
        type="button"
        class="registro-usuario-form__password-toggle"
        [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        (click)="alternarContrasena()"
      >
        <app-icon [name]="mostrarContrasena() ? 'ocultar' : 'ver'" [size]="18" />
      </button>
    </div>

    <div class="registro-usuario-form__password">
      <app-text-input
        label="Confirmar contraseña"
        [type]="mostrarConfirmar() ? 'text' : 'password'"
        autocomplete="new-password"
        placeholder="Repite tu contraseña"
        [value]="confirmarContrasena()"
        (valueChange)="confirmarContrasena.set($event)"
        [disabled]="cargando()"
        [error]="errorConfirmacion()"
      />
      <button
        type="button"
        class="registro-usuario-form__password-toggle"
        [attr.aria-label]="mostrarConfirmar() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        (click)="alternarConfirmar()"
      >
        <app-icon [name]="mostrarConfirmar() ? 'ocultar' : 'ver'" [size]="18" />
      </button>
    </div>

    <app-checkbox
      [checked]="aceptaTerminos()"
      (checkedChange)="aceptaTerminos.set($event)"
      [disabled]="cargando()"
    >
      Acepto los <a routerLink="/terminos">Términos de servicio</a> y la
      <a routerLink="/privacidad">Política de privacidad</a> de CarbonHub
    </app-checkbox>

    @if (error()) {
      <p class="registro-usuario-form__error" role="alert">{{ error() }}</p>
    }

    <app-button variant="primary" size="lg" type="submit" [loading]="cargando()">
      Crear cuenta →
    </app-button>
  </form>
} @else {
  <div class="registro-usuario-form__exito">
    <h2 class="registro-usuario-form__exito-title">Revisa tu correo</h2>
    <p class="registro-usuario-form__exito-text">
      Enviamos un enlace de verificación a <strong>{{ correoEnviado() }}</strong
      >. Confírmalo para poder iniciar sesión.
    </p>
  </div>
}
