<app-shell-layout activeId="certificaciones" [headerConfig]="headerConfig()">
  <section class="ch-certificaciones" aria-label="Certificaciones">
    <app-estado-certificaciones-panel
      class="ch-certificaciones__full"
      [resumen]="resumen()"
      [loading]="cargandoResumen()"
      [error]="resumenError()"
    />

    <app-alertas-activas-panel
      [alertas]="alertas()"
      [loading]="cargandoAlertas()"
      [error]="alertasError()"
    />

    <app-insignias-empresa-panel
      [insignias]="insignias()"
      [loading]="cargandoInsignias()"
      [error]="insigniasError()"
    />

    <app-metas-reduccion-panel
      [metas]="metas()"
      [loading]="cargandoMetas()"
      [error]="metasError()"
    />

    <app-calendario-vencimientos
      [mes]="mesCalendario()"
      [calendario]="calendario()"
      [loading]="cargandoCalendario()"
      [error]="calendarioError()"
      (mesChange)="onMesCalendarioChange($event)"
    />

    <a
      appLink
      routerLink="/empresa/certificaciones/listado"
      class="ch-certificaciones__listado-link ch-certificaciones__full"
    >
      Ver listado completo de certificaciones →
    </a>
  </section>
</app-shell-layout>
