<app-auth-layout>
  @if (!enviado()) {
    <div class="configuracion-empresa">
      <span class="configuracion-empresa__badge">EMPRESA · CONFIGURACIÓN INICIAL</span>

      <header class="configuracion-empresa__header">
        <h1 class="configuracion-empresa__title">Información de tu empresa</h1>
        <p class="configuracion-empresa__subtitle">
          Completa estos datos para terminar de configurar tu cuenta.
        </p>
      </header>

      <form class="configuracion-empresa__form" (submit)="enviar($event)">
        <app-text-input
          label="Nombre legal de la empresa"
          placeholder="Café del Valle S.A."
          [value]="nombreEmpresa()"
          (valueChange)="nombreEmpresa.set($event)"
          [disabled]="cargando()"
          [error]="errorNombreEmpresa()"
        />

        <div class="configuracion-empresa__row">
          <app-select-input
            label="Sector industrial"
            [options]="sectoresIndustriales"
            [value]="sectorIndustrial()"
            (valueChange)="sectorIndustrial.set($event)"
            [disabled]="cargando()"
            [error]="errorSectorIndustrial()"
          />
          <app-select-input
            label="País"
            [options]="paises"
            [value]="pais()"
            (valueChange)="pais.set($event)"
            [disabled]="cargando()"
            [error]="errorPais()"
          />
        </div>

        <div class="configuracion-empresa__row">
          <app-text-input
            label="Cantidad de empleados"
            type="number"
            placeholder="25"
            [value]="cantidadEmpleados()"
            (valueChange)="cantidadEmpleados.set($event)"
            [disabled]="cargando()"
            [error]="errorCantidadEmpleados()"
          />
          <app-text-input
            label="Cédula jurídica"
            placeholder="3-101-123456"
            [value]="cedulaJuridica()"
            (valueChange)="cedulaJuridica.set($event)"
            [disabled]="cargando()"
            [error]="errorCedulaJuridica()"
          />
        </div>

        <app-textarea
          label="Descripción (opcional)"
          placeholder="Cuéntanos brevemente a qué se dedica tu empresa..."
          [rows]="4"
          [value]="descripcion()"
          (valueChange)="descripcion.set($event)"
          [disabled]="cargando()"
          [error]="errorDescripcion()"
          [hint]="descripcionContador()"
        />

        @if (error()) {
          <p class="configuracion-empresa__error" role="alert">{{ error() }}</p>
        }

        <app-button variant="primary" size="lg" type="submit" [loading]="cargando()">
          Finalizar
        </app-button>
      </form>
    </div>
  } @else {
    <div class="configuracion-empresa__exito">
      <h2 class="configuracion-empresa__exito-title">¡Listo!</h2>
      <p class="configuracion-empresa__exito-text">
        Guardamos la información de <strong>{{ resultado()?.nombreEmpresa }}</strong
        >. Te estamos redirigiendo...
      </p>
    </div>
  }
</app-auth-layout>
