<app-auth-layout>
  <div class="validacion">
    <app-badge class="validacion__badge" variant="warning" icon="warning"
      >Verificación pendiente</app-badge
    >
    <app-heading level="h1" text="Tu cuenta está pendiente de verificación" />
    <p class="validacion__text">
      Te enviamos un correo electrónico para verificar tu cuenta. Revisa tu bandeja de entrada y haz
      clic en el enlace de confirmación.
    </p>
    <a class="validacion__link" routerLink="/login">&lt; Ir al inicio de sesión</a>
  </div>
</app-auth-layout>
