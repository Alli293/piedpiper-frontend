@if (cargando()) {
  <app-state-layout>
    <section class="ch-insignias-publicas__estado" aria-live="polite">
      <span class="ch-insignias-publicas__loader" aria-hidden="true"></span>
      <app-heading level="h1" text="Cargando insignias" />
      <p>Estamos consultando las insignias.</p>
    </section>
  </app-state-layout>
} @else if (noEncontrado()) {
  <app-state-layout>
    <section class="ch-insignias-publicas__estado">
      <app-heading level="h1" [text]="noEncontradoMensaje" />
      <p>Revisa el enlace e intenta de nuevo.</p>
      <app-button variant="secondary" (click)="volver()">
        <app-icon name="volver" [size]="16" />
        <span>Volver</span>
      </app-button>
    </section>
  </app-state-layout>
} @else if (error()) {
  <app-state-layout>
    <section class="ch-insignias-publicas__estado" role="alert">
      <app-heading level="h1" [text]="errorMensaje()" />
      <p>Puedes intentar nuevamente.</p>
      <app-button variant="secondary" (click)="reintentar()">Reintentar</app-button>
    </section>
  </app-state-layout>
} @else {
  <app-state-header />

  <main class="ch-insignias-publicas">
    <div class="ch-insignias-publicas__contenedor">
      <button
        type="button"
        class="ch-insignias-publicas__volver"
        aria-label="Volver"
        (click)="volver()"
      >
        <app-icon name="volver" [size]="16" />
      </button>
      <app-insignias-empresa-list
        titulo="Insignias activas"
        descripcion="Reconocimientos vigentes emitidos como credenciales verificables. Cualquier persona puede comprobar su autenticidad de forma independiente."
        [accionesPrivadas]="true"
        [insignias]="insignias()"
        (descargarJsonLd)="descargarJsonLd($event)"
        (descargarJwt)="descargarJwt($event)"
        (compartirLinkedIn)="compartirLinkedIn($event)"
        (verificarOpenBadges)="verificarOpenBadges($event)"
      />
    </div>
  </main>
}
