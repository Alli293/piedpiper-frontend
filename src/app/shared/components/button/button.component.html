<button
  class="ch-button__inner"
  [attr.id]="id()"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  @if (loading()) {
    <span class="ch-button__spinner" aria-hidden="true"></span>
  }
  <span class="ch-button__label" [style.visibility]="loading() ? 'hidden' : 'visible'">
    <ng-content />
  </span>
</button>
