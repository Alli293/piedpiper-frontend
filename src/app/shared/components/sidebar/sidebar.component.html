<div class="ch-sidebar__logo">
  <app-logo
    variant="on-dark"
    [iconSize]="22"
    textSize="1.25rem"
    iconAlt="Fingerprint icon"
    [hideTextBelowDesktop]="true"
  />
</div>

<div class="ch-sidebar__company">
  <div class="ch-sidebar__company-card">
    <app-avatar [initials]="companyInitials()" shape="square" />
    <div class="ch-sidebar__company-info">
      <span class="ch-sidebar__company-name">{{ companyName() }}</span>
      <span class="ch-sidebar__company-role">{{ companyRole() }}</span>
    </div>
  </div>
</div>

<nav class="ch-sidebar__nav" aria-label="Main navigation">
  @for (item of menuItems(); track item.id) {
    <button
      type="button"
      class="ch-sidebar__item"
      [class.ch-sidebar__item--active]="item.active"
      [class.ch-sidebar__item--disabled]="item.disabled"
      [attr.aria-current]="item.active ? 'page' : null"
      [attr.aria-disabled]="item.disabled || null"
      [attr.aria-label]="item.label"
      [attr.title]="item.label"
      (click)="!item.disabled && menuItemClicked.emit(item.id)"
    >
      <app-icon class="ch-sidebar__item-icon" [name]="item.icon" [size]="18" />
      <span class="ch-sidebar__item-label">{{ item.label }}</span>
    </button>
  }
</nav>

<div class="ch-sidebar__bottom">
  @for (item of bottomItems(); track item.id) {
    <button
      type="button"
      class="ch-sidebar__item"
      [class.ch-sidebar__item--active]="item.active"
      [attr.aria-current]="item.active ? 'page' : null"
      [attr.aria-label]="item.label"
      [attr.title]="item.label"
      (click)="menuItemClicked.emit(item.id)"
    >
      <app-icon class="ch-sidebar__item-icon" [name]="item.icon" [size]="18" />
      <span class="ch-sidebar__item-label">{{ item.label }}</span>
    </button>
  }
</div>
