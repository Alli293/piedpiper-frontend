<div class="ch-password-input__wrapper" (focusout)="onBlur()">
  <app-text-input
    [id]="id()"
    [label]="label()"
    [type]="type()"
    [autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [value]="value()"
    (valueChange)="onValueChange($event)"
    [error]="error()"
    [hint]="hint()"
    [disabled]="formDisabled()"
    [required]="required()"
  />
  <button
    type="button"
    class="ch-password-input__toggle"
    [attr.aria-label]="mostrar() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    (click)="alternarVisibilidad()"
  >
    <app-icon [name]="mostrar() ? 'ocultar' : 'ver'" [size]="18" />
  </button>
</div>
