@if (label()) {
  <span class="ch-file-drop__label" [id]="zonaId + '-label'">{{ label() }}</span>
}
<button
  #zona
  type="button"
  class="ch-file-drop__zone"
  [class.ch-file-drop__zone--activa]="arrastrando()"
  [class.ch-file-drop__zone--error]="mensajeError().length > 0"
  [disabled]="disabled()"
  [attr.aria-labelledby]="label() ? zonaId + '-label' : null"
  [attr.aria-describedby]="describedBy()"
  (click)="abrirSelector()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <app-icon name="descargar" [size]="24" />
  <span class="ch-file-drop__zone-title"
    >Arrastra tus archivos aquí o haz clic para seleccionar</span
  >
  <span class="ch-file-drop__zone-action">Seleccionar archivos</span>
</button>
<input
  #campo
  type="file"
  class="ch-file-drop__input"
  multiple
  [accept]="accept()"
  [disabled]="disabled()"
  tabindex="-1"
  aria-hidden="true"
  (change)="onSeleccion($event)"
/>
<p class="ch-file-drop__hint" [id]="hintId">{{ textoAyuda() }}</p>
@if (mensajeError()) {
  <p class="ch-file-drop__error" role="alert" [id]="errorId">{{ mensajeError() }}</p>
}
<ul
  class="ch-file-drop__list"
  [class.ch-file-drop__list--vacia]="vistas().length === 0"
  [id]="listaId"
  aria-live="polite"
>
  @for (vista of vistas(); track vista.clave) {
    <li class="ch-file-drop__item">
      <span class="ch-file-drop__item-name">{{ vista.nombre }}</span>
      <span class="ch-file-drop__item-size">{{ vista.tamanio }}</span>
      <button
        #remover
        type="button"
        class="ch-file-drop__remove"
        [disabled]="disabled()"
        [attr.aria-label]="'Eliminar ' + vista.nombre"
        (click)="eliminar($index)"
      >
        <app-icon name="cerrar" [size]="16" />
      </button>
    </li>
  }
</ul>
