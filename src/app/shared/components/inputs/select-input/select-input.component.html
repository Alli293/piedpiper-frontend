@if (label()) {
  <label class="ch-select-input__label" [for]="inputId">{{ label() }}</label>
}
<select
  class="ch-select-input__field"
  [class.ch-select-input__field--error]="hasError()"
  [id]="inputId"
  [disabled]="effectiveDisabled()"
  [attr.aria-invalid]="hasError() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  (change)="onChangeEvent($event)"
  (blur)="onBlur()"
>
  @if (placeholder()) {
    <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
  }
  @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
  }
</select>
@if (hasError()) {
  <p class="ch-select-input__error" [id]="errorId">{{ error() }}</p>
} @else if (hint()) {
  <p class="ch-select-input__hint" [id]="hintId">{{ hint() }}</p>
}
