@if (label()) {
  <span class="ch-chip-select__label" [id]="labelId">{{ label() }}</span>
}
<div
  class="ch-chip-select__group"
  role="group"
  [attr.aria-labelledby]="label() ? labelId : null"
  [attr.aria-describedby]="describedBy()"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="ch-chip-select__item"
      [class.ch-chip-select__item--active]="isActive(option.value)"
      [attr.aria-pressed]="isActive(option.value)"
      [disabled]="effectiveDisabled()"
      (click)="toggle(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
@if (hasError()) {
  <p class="ch-chip-select__error" role="alert" [id]="errorId">{{ error() }}</p>
} @else if (hint()) {
  <p class="ch-chip-select__hint" [id]="hintId">{{ hint() }}</p>
}
