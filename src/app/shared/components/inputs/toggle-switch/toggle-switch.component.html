<label
  class="ch-toggle-switch__wrapper"
  [class.ch-toggle-switch__wrapper--disabled]="effectiveDisabled()"
  [for]="inputId"
>
  <input
    type="checkbox"
    class="ch-toggle-switch__input"
    [id]="inputId"
    [checked]="checked()"
    [disabled]="effectiveDisabled()"
    [attr.aria-invalid]="hasError() ? 'true' : null"
    (change)="onInputChange($event)"
    (blur)="onBlur()"
  />
  <span class="ch-toggle-switch__track" aria-hidden="true">
    <span class="ch-toggle-switch__thumb"></span>
  </span>
  @if (label()) {
    <span class="ch-toggle-switch__label">{{ label() }}</span>
  } @else {
    <span class="ch-toggle-switch__label"><ng-content /></span>
  }
</label>
@if (hasError()) {
  <p class="ch-toggle-switch__error" role="alert">{{ error() }}</p>
}
