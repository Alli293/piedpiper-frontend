@if (label()) {
  <label class="ch-text-input__label" [for]="inputId">
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true"> *</span>
    }
  </label>
}
<input
  class="ch-text-input__field"
  [class.ch-text-input__field--error]="hasError()"
  [id]="inputId"
  [type]="type()"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="effectiveDisabled()"
  [required]="required()"
  [attr.aria-invalid]="hasError() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  (input)="onInput($event)"
  (blur)="onBlur()"
/>
@if (hasError()) {
  <p class="ch-text-input__error" [id]="errorId">{{ error() }}</p>
} @else if (hint()) {
  <p class="ch-text-input__hint" [id]="hintId">{{ hint() }}</p>
}
